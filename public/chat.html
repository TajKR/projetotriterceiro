<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat pog</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="menu">
    <a href="index.html" class="link-menu">Home</a>
    <a href="historia.html" class="link-menu">Historia</a>
    <a href="chat.html" class="link-menu ativo">Chat</a>
    <a href="login.html" class="link-menu">Log-in</a>
    <a href="cadastro.html" class="link-menu">Cadastro</a>
  </nav>

  <main class="page-shell">
    <section class="chat-card">
      <header class="chat-header">
        <h1 id="boasVindas">Bem-vindo ao Reino</h1>
      </header>
      <div id="caixaChat" class="janela-mensagens" aria-live="polite"></div>

      <form id="inputArea" class="formulario-envio">
        <input type="text" id="mensagem" placeholder="Digite sua mensagem">
        <button id="btnEnviar" type="submit">Enviar</button>
      </form>
    </section>
  </main>
  <footer>© Taj Kozak Reichel - 2026 | Curitiba</footer>
  <script>
    const caixaChat = document.getElementById('caixaChat')
    const inputArea = document.getElementById('inputArea')
    const mensagem = document.getElementById('mensagem')
    const btnEnviar = document.getElementById('btnEnviar')

    // Guarda a conversa para a IA lembrar do contexto
    const historico = []

    function adicionarMensagem(texto, tipo) {
      const div = document.createElement('div')
      div.className = `mensagem ${tipo}`
      div.textContent = texto // textContent evita injeção de HTML
      caixaChat.appendChild(div)
      caixaChat.scrollTop = caixaChat.scrollHeight
      return div
    }

    inputArea.addEventListener('submit', async (evento) => {
      evento.preventDefault()

      const texto = mensagem.value.trim()
      if (!texto) return

      adicionarMensagem(texto, 'usuario')
      historico.push({ role: 'user', content: texto })

      mensagem.value = ''
      mensagem.disabled = true
      btnEnviar.disabled = true

      const aguardando = adicionarMensagem('Pensando...', 'bot')

      try {
        const resposta = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ historico })
        })

        const dados = await resposta.json()

        if (!resposta.ok) {
          throw new Error(dados.erro || 'Erro ao falar com a IA')
        }

        aguardando.textContent = dados.resposta
        historico.push({ role: 'assistant', content: dados.resposta })
      } catch (erro) {
        aguardando.className = 'mensagem erro'
        aguardando.textContent = `Erro: ${erro.message}`
        historico.pop() // remove a pergunta que falhou do histórico
      } finally {
        mensagem.disabled = false
        btnEnviar.disabled = false
        mensagem.focus()
        caixaChat.scrollTop = caixaChat.scrollHeight
      }
    })
  </script>
</body>

</html>
